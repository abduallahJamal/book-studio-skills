<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="book-studio-skills — Bilingual AR/EN End-to-End Book Authoring, Tri-Engine Typesetting, RTL/LTR Cover Wrap, EPUB 3 &amp; 15-Gate Preflight QC Suite">
